# DeDox + Paperless-ngx - Proxmox LXC Deployment
#
# For use with an EXTERNAL llama.cpp server and Open WebUI instance.
# No Ollama or Open WebUI containers are included.
#
# Prerequisites:
#   - llama.cpp server running at DEDOX_OLLAMA_URL (OpenAI-compatible API)
#   - Open WebUI running at OPENWEBUI_URL (optional, for RAG sync)
#
# Usage:
#   cp .env.example .env  # Edit with your settings
#   docker compose up -d

services:
  # DeDox API Service
  dedox:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: dedox
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    environment:
      - DEDOX_CONFIG_DIR=/app/config
      - DEDOX_JWT_SECRET=${DEDOX_JWT_SECRET}
      # DeDox admin user (auto-created on first startup)
      - DEDOX_ADMIN_EMAIL=${DEDOX_ADMIN_EMAIL:-admin@example.com}
      - DEDOX_ADMIN_PASSWORD=${DEDOX_ADMIN_PASSWORD:-changeme123}
      # LLM provider: openai-compat for llama.cpp
      - DEDOX_LLM_PROVIDER=openai-compat
      - DEDOX_OLLAMA_URL=${DEDOX_OLLAMA_URL:-http://192.168.1.50:8080}
      - DEDOX_LLM_API_KEY=${DEDOX_LLM_API_KEY:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5-35b-a3b-q4.gguf}
      # Paperless-ngx (co-located in this compose stack)
      - DEDOX_PAPERLESS_URL=http://paperless:8000
      - DEDOX_PAPERLESS_TOKEN=${DEDOX_PAPERLESS_TOKEN:-}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER:-admin}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD:-admin}
      # Webhook secret (optional, for HMAC verification)
      - DEDOX_WEBHOOK_SECRET=${DEDOX_WEBHOOK_SECRET:-}
      # Open WebUI (external instance)
      - DEDOX_OPENWEBUI_URL=${DEDOX_OPENWEBUI_URL:-http://192.168.1.50:3000}
      - DEDOX_OPENWEBUI_API_KEY=${DEDOX_OPENWEBUI_API_KEY:-}
      - OPENWEBUI_ADMIN_EMAIL=${OPENWEBUI_ADMIN_EMAIL:-admin@example.com}
      - OPENWEBUI_ADMIN_PASSWORD=${OPENWEBUI_ADMIN_PASSWORD:-}
    depends_on:
      paperless:
        condition: service_healthy
    networks:
      - dedox-network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # DeDox Background Worker
  dedox-worker:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: dedox-worker
    restart: unless-stopped
    command: ["python", "-m", "dedox.services.job_worker"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    environment:
      - DEDOX_CONFIG_DIR=/app/config
      - DEDOX_JWT_SECRET=${DEDOX_JWT_SECRET}
      # LLM provider: openai-compat for llama.cpp
      - DEDOX_LLM_PROVIDER=openai-compat
      - DEDOX_OLLAMA_URL=${DEDOX_OLLAMA_URL:-http://192.168.1.50:8080}
      - DEDOX_LLM_API_KEY=${DEDOX_LLM_API_KEY:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5-35b-a3b-q4.gguf}
      # Paperless-ngx
      - DEDOX_PAPERLESS_URL=http://paperless:8000
      - DEDOX_PAPERLESS_TOKEN=${DEDOX_PAPERLESS_TOKEN:-}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER:-admin}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD:-admin}
      # Webhook secret (optional, for HMAC verification)
      - DEDOX_WEBHOOK_SECRET=${DEDOX_WEBHOOK_SECRET:-}
      # Open WebUI (external instance)
      - DEDOX_OPENWEBUI_URL=${DEDOX_OPENWEBUI_URL:-http://192.168.1.50:3000}
      - DEDOX_OPENWEBUI_API_KEY=${DEDOX_OPENWEBUI_API_KEY:-}
      - OPENWEBUI_ADMIN_EMAIL=${OPENWEBUI_ADMIN_EMAIL:-admin@example.com}
      - OPENWEBUI_ADMIN_PASSWORD=${OPENWEBUI_ADMIN_PASSWORD:-}
    depends_on:
      - dedox
    networks:
      - dedox-network

  # Paperless-ngx
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: dedox-paperless
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
    environment:
      - PAPERLESS_REDIS=redis://redis:6379
      - PAPERLESS_DBHOST=postgres
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS=${POSTGRES_PASSWORD:-paperless}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER:-admin}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD:-admin}
      - PAPERLESS_URL=${PAPERLESS_URL:-http://localhost:8080}
      - PAPERLESS_OCR_LANGUAGE=deu+eng
      - PAPERLESS_OCR_MODE=skip
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dedox-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # PostgreSQL for Paperless
  postgres:
    image: postgres:15-alpine
    container_name: dedox-postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-paperless}
    networks:
      - dedox-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Paperless
  redis:
    image: redis:7-alpine
    container_name: dedox-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - dedox-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dedox-network:
    driver: bridge

volumes:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume:
  postgres-data:
  redis-data:
